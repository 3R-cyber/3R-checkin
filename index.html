<style>

    --bg:#10161C; --surface:#1A222B; --surface-2:#212B35; --border:#2C3743;

  select,input[type=text],input[type=number],input[type=time],input[type=password],input[type=email],textarea{

    border:1px solid var(--border); background:var(--surface); color:var(--ink);
  }

  label.field{display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:600; color:var(--ink-muted);}

  .big-btn .sub{font-family:var(--font-body); font-weight:500; font-size:12.5px; opacity:.85;}
  .big-btn.go{background:var(--accent); color:var(--accent-ink);}
  .big-btn.done{background:var(--surface-2); color:var(--ink-faint);}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:8px 7px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
  .tablewrap table{min-width:720px;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:11px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:50; max-width:90vw; text-align:center;}
  .link-btn{background:none;border:none;color:var(--ink-muted);font-size:12.5px;text-decoration:underline;padding:2px 0;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .badge-site{font-size:11px; font-weight:700; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:999px;}
  ::selection{background:var(--accent-soft);}
  input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}

  var MONTH_KEY = function(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };

"위 내용을 확인하였으며 이에 동의합니다."
  };

    {empId:"3R0004", name:"김미애", dept:"닥터 사이먼팀 | PDSS", site:"seoul"},

    {empId:"3R0008", name:"정근영", dept:"Moment 사업부", site:"seoul"},
    {empId:"3R0009", name:"Mahsa Aghazadeh", dept:"닥터 사이먼팀 | PDSS", site:"daejeon"},
    {empId:"3R0010", name:"Mutalipov Firdavs", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0011", name:"이효신", dept:"Platform Engineering팀", site:"seoul"},
    {empId:"3R0012", name:"김예빈", dept:"콘텐츠 Marketing팀", site:"seoul"},
    {empId:"3R0013", name:"Fathony Achmad", dept:"Platform Engineering팀", site:"seoul"},
    {empId:"3R0014", name:"김민지", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0015", name:"성지훈", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0016", name:"이미숙", dept:"Moment 사업부", site:"seoul"},
    {empId:"3R0017", name:"이수민", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0018", name:"김세연", dept:"Moment 사업부", site:"seoul"},
    {empId:"3R0019", name:"박지수", dept:"콘텐츠 Marketing팀", site:"seoul"},
    {empId:"3R0020", name:"이대호", dept:"경영지원팀", site:"daejeon"},
    {empId:"3R0021", name:"백장미", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0022", name:"이경주", dept:"Focuspang 사업부", site:"seoul"},
    {empId:"3R0023", name:"김민아", dept:"사업개발&Sales팀", site:"seoul"}
  ];

  /* ---------- state ---------- */
  var db = null, auth = null, capsReady = false, configMissing = false;
  var state = {
    tab: "me",                 // "me" | "admin"
    employees: [],             // [{empId,name,dept,site}]
    config: DEFAULT_CONFIG,
    myId: localStorage.getItem(LS_ID) || "",
    consent: undefined,        // undefined = unknown, null = none, obj = exists
    myMonthDoc: null,          // this month's record doc for me
    busy: false,
    authUser: null,
    isAdmin: false,
    adminMonth: MONTH_KEY(),
    adminSiteFilter: "all",
    adminRows: [],             // flattened rows for current admin month
    adminLoading: false,
    empDraftId: null,
    bulkAddOpen: false
  };

  function haversine(lat1,lng1,lat2,lng2){
    var R=6371000, toRad=function(v){return v*Math.PI/180;};
    var dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
    var a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
  }

  function toast(msg, ms){
    var root = document.getElementById("toast-root");
    var el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.remove(); }, ms||2600);
  }

  function el(tag, attrs, children){
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==="class") n.className = attrs[k];
      else if(k==="html") n.innerHTML = attrs[k];
      else if(k.indexOf("on")===0 && typeof attrs[k]==="function") n.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]===true ? "" : attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c===null||c===undefined||c===false) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  /* ---------- firebase init ---------- */
  async function initFirebase(){
    if(String(firebaseConfig.apiKey||"").indexOf("PASTE_")===0){
      configMissing = true; capsReady = true; render(); return;
    }
    try{
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    }catch(e){
      configMissing = true; capsReady = true; render(); return;
    }

    auth.onAuthStateChanged(function(user){
      state.authUser = user;
      state.isAdmin = !!(user && !user.isAnonymous);
      render();
    });
    try{ await auth.signInAnonymously(); }catch(e){ /* onAuthStateChanged handles rendering */ }

    capsReady = true;
    await loadConfigAndEmployees();
    watchMyConsent();
    watchMyMonth();
    render();
  }

  async function loadConfigAndEmployees(){
    try{
      var cfgSnap = await db.doc("config/settings").get();
      if(cfgSnap.exists){
        var d = cfgSnap.data();
        state.config = Object.assign({}, DEFAULT_CONFIG, d, {
          sites: Object.assign({}, DEFAULT_CONFIG.sites, d.sites || {})
        });
      }
    }catch(e){}
    db.collection("employees").onSnapshot(function(snap){
      state.employees = snap.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return (a.empId||"").localeCompare(b.empId||""); });
      render();
    }, function(){});
  }

  function watchMyConsent(){
    if(!state.myId) { state.consent = null; return; }
    db.doc("consents/"+state.myId).onSnapshot(function(snap){
      state.consent = snap.exists ? snap.data() : null;
      render();
    }, function(){ state.consent = null; render(); });
  }

  function watchMyMonth(){
    if(!state.myId) return;
    var id = state.myId + "_" + MONTH_KEY();
    db.doc("checkins/"+id).onSnapshot(function(snap){
      state.myMonthDoc = snap.exists ? snap.data() : null;
      render();
    }, function(){});
  }

  function myEmployee(){
    return state.employees.find(function(e){ return e.empId === state.myId; }) || null;
  }
  function todaysRecords(monthDoc){
    if(!monthDoc || !monthDoc.records) return [];
    var tk = TODAY_KEY();
    return monthDoc.records.filter(function(r){ return r.date === tk; });
  }

  /* ---------- actions ---------- */
  function chooseIdentity(empId){
    state.myId = empId;
    localStorage.setItem(LS_ID, empId);
    state.consent = undefined; state.myMonthDoc = null;
    watchMyConsent(); watchMyMonth();
    render();
  }
  function switchIdentity(){
    state.myId = ""; localStorage.removeItem(LS_ID);
    state.consent = undefined; state.myMonthDoc = null;
    render();
  }

  async function giveConsent(){
    if(!db) return;
    var emp = myEmployee(); if(!emp) return;
    state.busy = true; render();
    try{
      await db.doc("consents/"+state.myId).set({
        empId: state.myId, name: emp.name, agreedAt: new Date().toISOString(), policyVersion: state.config.policyVersion
      });
    }catch(e){ toast("동의 저장에 실패했어요. 다시 시도해주세요."); }
    state.busy = false; render();
  }

  function getPosition(){
    return new Promise(function(resolve, reject){
      if(!navigator.geolocation){ reject({code:"unsupported"}); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve(pos); },
        function(err){ reject(err); },
        { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
      );
    });
  }

  async function doCheck(type){
    var emp = myEmployee(); if(!emp || state.busy) return;
    state.busy = true; render();
    try{
      var pos = await getPosition();
      var site = state.config.sites[emp.site];
      var dist = haversine(pos.coords.latitude, pos.coords.longitude, site.lat, site.lng);
      var radius = state.config.radiusM;
      if(dist > radius){
        toast("사업장(" + site.label + ")에서 약 " + dist + "m 떨어져 있어요. 반경 " + radius + "m 이내에서 다시 시도해주세요.", 4200);
        state.busy = false; render(); return;
      }
      var now = new Date();
      var timeStr = HHMM(now);
      var status = type === "in"
        ? (timeStr > state.config.workStart ? "지각" : "정상")
        : (timeStr < state.config.workEnd ? "조퇴" : "정상");
      var rec = {
        date: TODAY_KEY(now), type: type, ts: now.toISOString(), time: timeStr,
        lat: pos.coords.latitude, lng: pos.coords.longitude,
        accuracy: Math.round(pos.coords.accuracy || 0), distanceM: dist, status: status
      };
      var docId = state.myId + "_" + MONTH_KEY(now);
      var ref = db.doc("checkins/"+docId);
      var snap = await ref.get();
      var records = (snap.exists && snap.data().records) ? snap.data().records.slice() : [];
      records.push(rec);
      var body = { empId: state.myId, name: emp.name, dept: emp.dept||"", site: emp.site, month: MONTH_KEY(now), records: records };
      if(snap.exists) await ref.update(body); else await ref.set(body);
      toast((type==="in" ? "출근" : "퇴근") + " 체크 완료 · " + timeStr + " · " + status);
    }catch(err){
      if(err && (err.code===1 || err.code==="PERMISSION_DENIED")) toast("위치 접근 권한이 필요해요. 브라우저 설정에서 위치 권한을 허용해주세요.", 4000);

  async function loadAdminMonth(){
    if(!db || state.employees.length===0){ state.adminRows=[]; return; }
    state.adminLoading = true; render();
    var month = state.adminMonth;
    try{
      var snaps = await Promise.all(state.employees.map(function(e){
        return db.doc("checkins/"+e.empId+"_"+month).get();
      }));
      var rows = [];
      snaps.forEach(function(s){
        if(!s.exists) return;
        var d = s.data();
        (d.records||[]).forEach(function(r, idx){
          rows.push(Object.assign({}, r, { empId:d.empId, name:d.name, dept:d.dept, site:d.site, _docId:s.id, _idx:idx }));
        });
      });
      rows.sort(function(a,b){ return (b.ts||"").localeCompare(a.ts||""); });
      state.adminRows = rows;
    }catch(e){ toast("기록을 불러오지 못했어요. 관리자 권한을 확인해주세요."); }
    state.adminLoading = false; render();

  function parseBulkEmployees(text){
    var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
    var rows = [], errors = [];
    lines.forEach(function(line, idx){
      var parts = line.split(",").map(function(p){ return p.trim(); });
      var empId = parts[0], name = parts[1], dept = parts[2] || "", siteRaw = (parts[3]||"").toLowerCase();
      if(!empId || !name){ errors.push((idx+1)+"행: 사번/이름이 비어있어요 → \""+line+"\""); return; }
      var site = (siteRaw==="대전" || siteRaw==="daejeon") ? "daejeon" : "seoul";
      rows.push({ empId:empId, name:name, dept:dept, site:site });
    });
    return { rows:rows, errors:errors };
  }

  async function adminBulkAddEmployees(text){
    var parsed = parseBulkEmployees(text);
    if(parsed.errors.length){ toast("형식 오류 "+parsed.errors.length+"건:\n"+parsed.errors.slice(0,3).join("\n")); return false; }
    if(!parsed.rows.length){ toast("추가할 내용이 없어요."); return false; }
    try{
      var batch = db.batch();
      parsed.rows.forEach(function(e){ batch.set(db.doc("employees/"+e.empId), e); });
      await batch.commit();
      toast(parsed.rows.length+"명의 직원이 등록되었어요.");
      return true;
    }catch(e){ toast("일괄 등록에 실패했어요. 관리자 계정으로 로그인했는지 확인해주세요."); return false; }
  }

      var batch = db.batch();
      SEED_EMPLOYEES.forEach(function(e){ batch.set(db.doc("employees/"+e.empId), e); });
      batch.set(db.doc("config/settings"), DEFAULT_CONFIG);

    }catch(e){ toast("초기화에 실패했어요: " + ((e && e.message) || "관리자 계정으로 로그인했는지 확인해주세요.")); }

  function exportExcel(){
    if(typeof XLSX === "undefined"){ toast("표 생성 라이브러리를 불러오는 중이에요. 잠시 후 다시 시도해주세요."); return; }
    var rows = state.adminRows.filter(function(r){ return state.adminSiteFilter==="all" || r.site===state.adminSiteFilter; });
    var data = rows.map(function(r){
      return {
        "날짜": r.date, "사번": r.empId, "이름": r.name, "부서": r.dept||"",
        "지점": state.config.sites[r.site] ? state.config.sites[r.site].label : r.site,
        "구분": r.type==="in" ? "출근" : "퇴근", "시각": r.time, "상태": r.status,
        "거리(m)": r.distanceM, "위도": r.lat, "경도": r.lng,
        "수정자": r.editedBy||"", "수정시각": r.editedAt||""
      };
    });
    if(data.length===0){ toast("내보낼 기록이 없어요."); return; }
    try{
      var ws = XLSX.utils.json_to_sheet(data);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, state.adminMonth);
      XLSX.writeFile(wb, "출퇴근기록_"+state.adminMonth+".xlsx");
      toast("엑셀 파일을 다운로드했어요.");
    }catch(e){ toast("내보내기에 실패했어요."); }
  }

          el("div",{class:"row",style:"gap:6px;"},[
            draft.empId && state.employees.find(function(e){return e.empId===draft.empId;}) ?
              el("button",{class:"btn btn-danger btn-sm", onclick:function(){ adminDeleteEmployee(draft.empId); }},["삭제"]) : null,
            el("button",{class:"btn btn-primary btn-sm", onclick:function(){
              var empId = idIn.value.trim();
              if(!empId || !nameIn.value.trim()){ toast("사번과 이름을 입력해주세요."); return; }
              adminSaveEmployee({ empId:empId, name:nameIn.value.trim(), dept:deptIn.value.trim(), site:siteSel2.value });
            }},["저장"])
          ])
        ])
      ]);
    }

    var bulkCard = null;
    if(state.bulkAddOpen){
      var bulkTa = el("textarea",{placeholder:"한 줄에 한 명씩, 쉼표로 구분해서 붙여넣으세요.\n예)\n3R0024,홍길동,개발팀,서울\n3R0025,김철수,영업팀,대전", style:"min-height:120px;"});
      bulkCard = el("div",{class:"card card-tight", style:"border:1px dashed var(--border);"},[
        el("div",{class:"muted"},["형식: 사번,이름,부서,지점(서울 또는 대전) — 한 줄에 한 명씩. 부서·지점은 비워두면 각각 미지정/서울로 들어가요."]),
        bulkTa,
        el("div",{class:"row"},[
          el("button",{class:"btn btn-ghost btn-sm", onclick:function(){ state.bulkAddOpen=false; render(); }},["취소"]),
          el("button",{class:"btn btn-primary btn-sm", onclick:function(){
            adminBulkAddEmployees(bulkTa.value).then(function(ok){ if(ok){ state.bulkAddOpen=false; render(); } });
          }},["일괄 등록"])
        ])
      ]);
    }

    return el("div",{class:"card"},[
      el("div",{class:"row"},[
        el("h3",{style:"font-size:15px;"},["직원 관리"]),
        el("div",{class:"row", style:"gap:6px;"},[
          el("button",{class:"btn btn-ghost btn-sm", onclick:function(){ state.bulkAddOpen=!state.bulkAddOpen; state.empDraftId=null; render(); }},["여러 명 한꺼번에 추가"]),
          el("button",{class:"btn btn-ghost btn-sm", onclick:function(){ state.empDraftId="__new__"; state.bulkAddOpen=false; render(); }},["+ 직원 추가"])
        ])
      ]),
      bulkCard,
      formCard,
      el("div",{class:"col"}, list)
    ]);
  }

  function AdminSettingsCard(){
    var c = state.config;
    var mk = function(label, input){ return el("label",{class:"field"},[label, input]); };
    var seoulLat = el("input",{type:"text", value:c.sites.seoul.lat});
    var seoulLng = el("input",{type:"text", value:c.sites.seoul.lng});
    var seoulLabel = el("input",{type:"text", value:c.sites.seoul.label});
    var daejeonLat = el("input",{type:"text", value:c.sites.daejeon.lat});
    var daejeonLng = el("input",{type:"text", value:c.sites.daejeon.lng});
    var daejeonLabel = el("input",{type:"text", value:c.sites.daejeon.label});
    var radiusIn = el("input",{type:"number", value:c.radiusM});
    var startIn = el("input",{type:"time", value:c.workStart});
    var endIn = el("input",{type:"time", value:c.workEnd});
    var policyIn = el("textarea",{}, [c.policyText]);

    return el("div",{class:"card"},[
      el("h3",{style:"font-size:15px;"},["설정"]),
      el("div",{class:"muted"},["서울 사업장"]),
      el("div",{class:"grid2"},[mk("명칭", seoulLabel), mk("반경(m)", radiusIn)]),
      el("div",{class:"grid2"},[mk("위도", seoulLat), mk("경도", seoulLng)]),
      el("div",{class:"muted"},["대전 사업장"]),
      el("div",{class:"grid2"},[mk("명칭", daejeonLabel), mk("근무 시작", startIn)]),
      el("div",{class:"grid2"},[mk("위도", daejeonLat), mk("경도", daejeonLng)]),
      el("div",{class:"grid2"},[mk("근무 종료", endIn)]),
      mk("개인정보 동의 안내문", policyIn),
      el("button",{class:"btn btn-primary", onclick:function(){
        adminSaveSettings({
          sites: {
            seoul:{ label:seoulLabel.value, lat:parseFloat(seoulLat.value), lng:parseFloat(seoulLng.value) },
            daejeon:{ label:daejeonLabel.value, lat:parseFloat(daejeonLat.value), lng:parseFloat(daejeonLng.value) }
          },
          radiusM: parseInt(radiusIn.value,10) || 100,
          workStart: startIn.value, workEnd: endIn.value,
          policyText: policyIn.value,
          policyVersion: c.policyVersion
        });
      }},["설정 저장"])
    ]);
  }

  function AdminSeedCard(){
    return el("div",{class:"card"},[
      el("h3",{style:"font-size:15px;"},["초기 데이터 세팅"]),
      el("div",{class:"muted"},["최초 1회만 눌러주세요. 이미 직원 데이터가 있으면 아무 것도 바뀌지 않아요."]),
      el("button",{class:"btn btn-ghost", onclick:seedInitialData},["기본 직원·설정 데이터 심기"])
    ]);
  }

  /* ---------- clock tick ---------- */
  setInterval(function(){
    if(document.hidden) return;
    var clockEl = document.querySelector(".clock");
    if(clockEl) clockEl.textContent = HHMM()+":"+String(new Date().getSeconds()).padStart(2,"0");
  }, 1000);

  render();
  initFirebase();
})();
</script>
