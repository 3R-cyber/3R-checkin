  table{width:100%; border-collapse:collapse; font-size:12.5px;}

  th{color:var(--ink-faint); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  .tablewrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;}
  .tablewrap table{min-width:720px;}
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:11px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:50; max-width:90vw; text-align:center;}

  /* ---------- state ---------- */
  var db = null, auth = null, capsReady = false, configMissing = false, employeesLoaded = false;
  var state = {
    tab: "me",                 // "me" | "admin"
    employees: [],             // [{empId,name,dept,site,email}]
    config: DEFAULT_CONFIG,
    myId: "",                  // resolved from the signed-in Google account's email, not chosen freely
    googleUnmatched: false,    // signed in with a valid company Google account, but no employee record has that email

    confirmingReset: false,    // "전체 초기화"는 되돌릴 수 없는 파괴적 동작이라 한 번 더 확인받는다

  };

  function haversine(lat1,lng1,lat2,lng2){
    var R=6371000, toRad=function(v){return v*Math.PI/180;};
    var dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
    var a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
  }

  // returns every configured site's distance from (lat,lng), nearest first
  function rankSites(lat, lng){
    var sites = state.config.sites || {};
    return Object.keys(sites).map(function(key){
      var s = sites[key];
      return { key:key, label:s.label, dist: haversine(lat, lng, s.lat, s.lng) };
    }).sort(function(a,b){ return a.dist - b.dist; });
  }

  // workStart/workEnd are optional — pass an employee's own exception hours,
  // or omit to fall back to the site-wide default in state.config.
  function computeStatus(type, timeStr, workStart, workEnd){
    workStart = workStart || state.config.workStart;
    workEnd = workEnd || state.config.workEnd;
    return type === "in"
      ? (timeStr > workStart ? "지각" : "정상")
      : (timeStr < workEnd ? "조퇴" : "정상");
  }

  // an employee's effective work hours: their own exception if set, else the site-wide default.
  function effectiveHours(emp){
    return {
      start: (emp && emp.workStart) || state.config.workStart,
      end: (emp && emp.workEnd) || state.config.workEnd
    };
  }

  // a random ID persisted in this browser's localStorage, so every check-in from
  // the same browser/device carries the same tag over time. Not a security lock —
  // it resets if the person clears site data, uses a private window, or switches
  // devices/browsers — but it's a useful audit trail: if two different 사번 show
  // the same device ID, that's worth an admin taking a look at (see computeSuspectDevices).
  function getDeviceId(){
    try{
      var id = localStorage.getItem(LS_DEVICE);
      if(!id){
        id = (typeof crypto !== "undefined" && crypto.randomUUID)
          ? crypto.randomUUID().replace(/-/g,"").slice(0,8).toUpperCase()
          : Math.random().toString(36).slice(2,10).toUpperCase();
        localStorage.setItem(LS_DEVICE, id);
      }
      return id;
    }catch(e){ return null; }
  }

  // groups the currently-loaded admin rows by device ID and flags any device ID
  // that's been used to check in under 2+ different 사번 — a signal (not proof)
  // of possible 대리출근. Shared office PCs can trigger this legitimately.
  function computeSuspectDevices(){
    var byDevice = {};
    state.adminRows.forEach(function(r){
      if(!r.device) return;
      byDevice[r.device] = byDevice[r.device] || {};
      byDevice[r.device][r.empId] = r.name;
    });
    var suspects = {};
    Object.keys(byDevice).forEach(function(dev){
      var empIds = Object.keys(byDevice[dev]);
      if(empIds.length >= 2){
        suspects[dev] = empIds.map(function(id){ return { empId:id, name:byDevice[dev][id] }; });
      }
    });
    return suspects;
  }

  // counts "지각" check-ins per employee within the given (already month/site
  // filtered) rows, so it always matches whatever the admin is currently looking
  // at rather than always the whole month regardless of the site filter.
  function computeChronicLate(rows, threshold){
    threshold = threshold || 3;
    var counts = {};
    rows.forEach(function(r){
      if(r.type !== "in" || r.status !== "지각") return;
      counts[r.empId] = counts[r.empId] || { empId:r.empId, name:r.name, count:0 };
      counts[r.empId].count++;
    });
    return Object.keys(counts).map(function(k){ return counts[k]; })
      .filter(function(c){ return c.count >= threshold; })
      .sort(function(a,b){ return b.count - a.count; });
  }

  // asks a public IP-echo service what public IP this browser is exiting through.
  // used to recognize "connected to the office network" without needing GPS.
  // returns null (never throws) if the request fails, times out, or is unavailable.
  async function fetchPublicIP(){
    try{
      var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 4000) : null;
      var res = await fetch("https://api.ipify.org?format=json", ctrl ? {signal: ctrl.signal} : {});
      if(timer) clearTimeout(timer);
      if(!res.ok) return null;
      var data = await res.json();
      return (data && data.ip) ? data.ip : null;
    }catch(e){ return null; }
  }

  // checks a fetched public IP against each site's configured allow-list (comma-separated in config.sites[key].ip)
  // supports an exact IP ("193.186.4.174") or a wildcard octet pattern ("121.138.152.*")
  function ipMatchesPattern(ip, pattern){
    if(!ip || !pattern) return false;
    if(pattern.indexOf("*") === -1) return ip === pattern;
    var patternParts = pattern.split(".");
    var ipParts = ip.split(".");
    if(patternParts.length !== ipParts.length) return false;
    for(var i=0;i<patternParts.length;i++){
      if(patternParts[i] !== "*" && patternParts[i] !== ipParts[i]) return false;
    }
    return true;
  }

  function matchSiteByIP(ip){
    if(!ip) return null;
    var sites = state.config.sites || {};
    var keys = Object.keys(sites);
    for(var i=0;i<keys.length;i++){
      var key = keys[i];
      var list = String(sites[key].ip||"").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
      for(var j=0;j<list.length;j++){
        if(ipMatchesPattern(ip, list[j])) return { key:key, label: sites[key].label };
      }
    }
    return null;
  }

  function toast(msg, ms){
    var root = document.getElementById("toast-root");
    var el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.remove(); }, ms||2600);
  }

  function el(tag, attrs, children){
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==="class") n.className = attrs[k];
      else if(k==="html") n.innerHTML = attrs[k];
      else if(k.indexOf("on")===0 && typeof attrs[k]==="function") n.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) n.setAttribute(k, attrs[k]===true ? "" : attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c===null||c===undefined||c===false) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  }

  /* ---------- identity: real company Google login, not a free name-picker ---------- */
  // an employee's identity now comes from a real, authenticated company Google
  // account — matched to their employees/{empId} record by email — instead of
  // freely picking any name from a dropdown. Admins keep signing in with
  // email/password (checked via Firestore rules' isAdmin()), so we tell the two
  // apart by auth provider rather than by "is this user anonymous".
  function isGoogleUser(user){
    return !!(user && user.providerData && user.providerData.some(function(p){ return p.providerId === "google.com"; }));
  }
  function isPasswordUser(user){
    return !!(user && user.providerData && user.providerData.some(function(p){ return p.providerId === "password"; }));
  }
  function matchEmployeeByEmail(email){
    if(!email) return null;
    var norm = email.toLowerCase();
    return state.employees.find(function(e){ return (e.email||"").toLowerCase() === norm; }) || null;
  }

  var domainRejectInFlight = false;
  // re-evaluates who "me" is, given the current signed-in user and employee list.
  // called after every auth change AND every employees-list refresh, since on a
  // fresh page load these two can resolve in either order.
  function syncGoogleIdentity(){
    var user = state.authUser;
    if(!isGoogleUser(user)){ state.googleUnmatched = false; return; }

    var suffix = "@"+ALLOWED_EMAIL_DOMAIN;
    var email = (user.email || "").toLowerCase();
    var domainOk = email.length > suffix.length && email.slice(-suffix.length) === suffix;
    if(!domainOk){
      state.myId = ""; state.googleUnmatched = false;
      if(!domainRejectInFlight){
        domainRejectInFlight = true;
        toast("회사 이메일 계정("+ALLOWED_EMAIL_DOMAIN+")으로 로그인해주세요.", 4200);
        auth.signOut().then(function(){ return auth.signInAnonymously(); }).catch(function(){}).then(function(){ domainRejectInFlight = false; });
      }
      return;
    }
    if(!employeesLoaded) return; // don't judge "unmatched" until we've actually loaded the employee list

    var matched = matchEmployeeByEmail(email);
    if(matched){
      state.googleUnmatched = false;
      if(state.myId !== matched.empId){
        state.myId = matched.empId;
        state.consent = undefined; state.myMonthDoc = null;
        watchMyConsent(); watchMyMonth();
      }
    } else {
      state.myId = ""; state.googleUnmatched = true;
    }
  }

  function signInWithGoogle(){
    // signInWithPopup rather than signInWithRedirect — Chrome's bounce-tracking
    // mitigation can wipe the Firebase authDomain's storage mid-flow on a
    // redirect chain (github.io -> firebaseapp.com/__/auth/handler -> google.com
    // -> back), which silently drops the pending sign-in and bounces the user
    // back to the login screen. A popup never leaves the current tab, so that
    // redirect chain — and the mitigation that targets it — never comes into play.
    var provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ hd: ALLOWED_EMAIL_DOMAIN }); // hints Google's account picker to the work domain (UX only, not a security check)
    auth.signInWithPopup(provider).then(function(result){
      // Don't just wait for the shared onAuthStateChanged listener — update state
      // and re-render right here so the UI reflects the login the instant the
      // popup resolves, instead of needing a manual page refresh to catch up.
      state.authUser = result.user;
      state.isAdmin = isPasswordUser(result.user);
      syncGoogleIdentity();
      render();
    }).catch(function(e){
      if(e && e.code === "auth/popup-closed-by-user") return; // user backed out — no error needed
      if(e && e.code === "auth/popup-blocked"){
        toast("팝업이 차단됐어요. 브라우저 팝업 차단을 해제하고 다시 시도해주세요.", 4500);
        return;
      }
      toast("로그인에 실패했어요"+((e&&e.code)?" ("+e.code+")":"")+".", 4200);
    });
  }

  function employeeSignOut(){
    state.myId = ""; state.googleUnmatched = false;
    state.consent = undefined; state.myMonthDoc = null;
    state.confirmingCheckout = false;
    auth.signOut().then(function(){ return auth.signInAnonymously(); }).catch(function(){});
    render();

  /* ---------- firebase init ---------- */
  async function initFirebase(){
    if(String(firebaseConfig.apiKey||"").indexOf("PASTE_")===0){
      configMissing = true; capsReady = true; render(); return;
    }
    try{
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    }catch(e){
      configMissing = true; capsReady = true; render(); return;
    }

    // waits for Firebase to report whatever session was already persisted (admin
    // login or a signed-in Google/anonymous session survives a refresh on its own)
    // and only falls back to signing in anonymously when there's truly no session
    // yet — calling signInAnonymously() unconditionally on every load, as before,
    // would silently knock out a persisted session and replace it with a fresh
    // anonymous one, logging everyone out on every refresh.
    await new Promise(function(resolve){
      var bootstrapped = false;
      auth.onAuthStateChanged(function(user){
        state.authUser = user;
        state.isAdmin = isPasswordUser(user);
        syncGoogleIdentity();
        render();
        if(!bootstrapped){
          bootstrapped = true;
          if(user) resolve();
          else auth.signInAnonymously().catch(function(){}).then(resolve);
        }
      });
    });

    capsReady = true;
    await loadConfigAndEmployees();
    watchMyConsent();
    watchMyMonth();
    render();
  }

  function getPosition(){
    return new Promise(function(resolve, reject){
      if(!navigator.geolocation){ reject({code:"unsupported"}); return; }
      navigator.geolocation.getCurrentPosition(

        function(err){ reject(err); },
        { enableHighAccuracy:true, timeout:12000, maximumAge:0 }

    });

  async function doCheck(type, lateReason){
    var emp = myEmployee(); if(!emp || state.busy) return;
    state.busy = true; render();
    try{
      var now = new Date();
      var timeStr = HHMM(now);
      var rec;
      var anyIpConfigured = Object.keys(state.config.sites).some(function(k){
        return String(state.config.sites[k].ip||"").trim().length > 0;
      });
      if(!anyIpConfigured){
        toast("관리자가 아직 사업장 와이파이를 설정하지 않았어요. 관리자에게 문의해주세요.", 4200);
        state.busy = false; render(); return;
      }
      var publicIp = await fetchPublicIP();
      var ipMatch = matchSiteByIP(publicIp);
      if(!ipMatch){
        toast("사업장 와이파이에 연결된 상태에서만 체크할 수 있어요. 와이파이 연결을 확인하고 다시 시도해주세요.", 4600);
        state.busy = false; render(); return;
      }
      var hours = effectiveHours(emp);
      rec = {
        date: TODAY_KEY(now), type: type, ts: now.toISOString(), time: timeStr,
        lat: null, lng: null, accuracy: null, distanceM: null, site: ipMatch.key,
        method: "wifi", status: computeStatus(type, timeStr, hours.start, hours.end),
        device: getDeviceId(), ip: publicIp || null
      };
      // 지각 사유는 거짓말을 막는 장치가 아니라, 관리자가 나중에 참고할 수 있는
      // 선택적 메모일 뿐이라 실제로 "지각"으로 판정된 경우에만 붙인다.
      if(type === "in" && rec.status === "지각" && lateReason && lateReason.trim()){
        rec.reason = lateReason.trim();
      }
      var docId = state.myId + "_" + MONTH_KEY(now);
      var ref = db.doc("checkins/"+docId);
      var snap = await ref.get();
      var records = (snap.exists && snap.data().records) ? snap.data().records.slice() : [];
      records.push(rec);
      var body = { empId: state.myId, name: emp.name, dept: emp.dept||"", site: emp.site, month: MONTH_KEY(now), records: records };
      if(snap.exists) await ref.update(body); else await ref.set(body);
      toast((type==="in" ? "출근" : "퇴근") + " 체크 완료 · " + timeStr + " · " + rec.status);
      state.lateReasonDraft = "";
    }catch(err){
      toast("체크에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.", 3600);
    }
    state.busy = false; render();
  }

  async function adminLogin(email, pw){
    if(!email || !pw){ toast("이메일과 비밀번호를 입력해주세요."); return; }
    try{

      toast("로그인에 실패했어요. 이메일/비밀번호를 확인해주세요."+((e&&e.code)?" ("+e.code+")":""), 4500);

  async function adminBulkDeleteRecords(){
    var keys = Object.keys(state.adminSelected).filter(function(k){ return state.adminSelected[k]; });
    if(!keys.length){ toast("선택된 기록이 없어요."); return; }
    if(!confirm(keys.length+"건을 삭제할까요? 되돌릴 수 없어요.")) return;

    var byDoc = {};
    keys.forEach(function(k){
      var parts = k.split("#");
      var docId = parts[0], idx = parseInt(parts[1], 10);
      (byDoc[docId] = byDoc[docId] || []).push(idx);
    });

    try{
      await Promise.all(Object.keys(byDoc).map(async function(docId){
        var ref = db.doc("checkins/"+docId);
        var snap = await ref.get();
        if(!snap.exists) return;
        var records = snap.data().records.slice();
        var idxs = byDoc[docId].sort(function(a,b){ return b-a; }); // descending so splice doesn't shift earlier indices
        idxs.forEach(function(idx){ records.splice(idx, 1); });
        await ref.update({ records: records });
      }));
      toast(keys.length+"건 삭제되었어요.");
      state.adminSelected = {};
      loadAdminMonth();
    }catch(e){ toast("일괄 삭제에 실패했어요. 관리자 권한이 있는 계정인지 확인해주세요."); }

  function parseBulkEmployees(text){
    var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
    var rows = [], errors = [];
    lines.forEach(function(line, idx){
      var parts = line.split(",").map(function(p){ return p.trim(); });
      var empId = parts[0], name = parts[1], dept = parts[2] || "", siteRaw = (parts[3]||"").toLowerCase(), email = (parts[4]||"").toLowerCase();
      if(!empId || !name){ errors.push((idx+1)+"행: 사번/이름이 비어있어요 → \""+line+"\""); return; }
      var site = (siteRaw==="대전" || siteRaw==="daejeon") ? "daejeon" : "seoul";
      rows.push({ empId:empId, name:name, dept:dept, site:site, email:email });
    });
    return { rows:rows, errors:errors };
  }

  async function adminBulkAddEmployees(text){
    var parsed = parseBulkEmployees(text);
    if(parsed.errors.length){ toast("형식 오류 "+parsed.errors.length+"건:\n"+parsed.errors.slice(0,3).join("\n")); return false; }
    if(!parsed.rows.length){ toast("추가할 내용이 없어요."); return false; }
    try{
      var batch = db.batch();
      parsed.rows.forEach(function(e){ batch.set(db.doc("employees/"+e.empId), e); });
      await batch.commit();
      toast(parsed.rows.length+"명의 직원이 등록되었어요.");
      return true;
    }catch(e){ toast("일괄 등록에 실패했어요. 관리자 계정으로 로그인했는지 확인해주세요."); return false; }
  }

  // every existing employee, so the admin can fill it in with Excel and

  function downloadEmailTemplateXlsx(){

  // 형식: 사번,이름(참고용, 실제로는 무시됨),이메일 — 각 줄의 마지막 칸을 이메일로
  // 읽으므로 "사번,이메일" 두 칸짜리 줄도 그대로 지원한다.
  function parseBulkEmails(text){
    var lines = text.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length; });
    var rows = [], errors = [];
    lines.forEach(function(line, idx){
      var parts = line.split(",").map(function(p){ return p.trim(); });
      var empId = parts[0];
      var email = (parts[parts.length-1] || "").toLowerCase();
      if(!empId){ errors.push((idx+1)+"행: 사번이 비어있어요 → \""+line+"\""); return; }
      if(!state.employees.find(function(e){ return e.empId === empId; })){
        errors.push((idx+1)+"행: 사번 "+empId+"인 직원을 찾을 수 없어요.");
        return;
      }
      if(!email || email.indexOf("@") === -1){
        errors.push((idx+1)+"행("+empId+"): 이메일 형식이 아니에요 → \""+(parts[parts.length-1]||"")+"\"");
        return;
      }
      rows.push({ empId:empId, email:email });
    });
    return { rows:rows, errors:errors };
  }

  // shared commit step for both the textarea path and the Excel-upload path:
  // updates ONLY the email field on each matched existing employee doc (via
  // {merge:true}), so dept/site/근무시간 예외 같은 다른 필드는 그대로 남는다 —
  // 전체 필드를 다시 입력해야 하는 기존 "일괄 등록"과 달리 이메일만 안전하게 갱신.
  async function commitBulkEmails(rows){
    if(!rows.length){ toast("등록할 이메일이 없어요."); return false; }
    try{
      var batch = db.batch();
      rows.forEach(function(r){ batch.set(db.doc("employees/"+r.empId), { email:r.email }, { merge:true }); });
      await batch.commit();
      toast(rows.length+"명의 이메일이 저장되었어요.");
      return true;
    }catch(e){ toast("일괄 저장에 실패했어요. 관리자 계정으로 로그인했는지 확인해주세요."); return false; }
  }

  async function adminBulkUpdateEmails(text){
    var parsed = parseBulkEmails(text);
    if(parsed.errors.length){ toast("형식 오류 "+parsed.errors.length+"건:\n"+parsed.errors.slice(0,5).join("\n"), 5500); return false; }
    return commitBulkEmails(parsed.rows);
  }

  // finds the 사번/이메일 columns by header text (여러 흔한 표기를 인식), so an
  // admin's own HR 스프레드시트를 열 순서·추가 칼럼 상관없이 그대로 올릴 수 있다.
  // 인식 가능한 헤더가 없으면 우리 템플릿과 같은 "사번,이름,이메일" 순서로 간주한다.
  function detectEmailColumns(headerRow){
    var idAliases = ["사번","사원번호","empid","employeeid","id"];
    var emailAliases = ["이메일","email","구글이메일","googleemail","이메일주소","emailaddress","gmail","g메일"];
    var idIdx = -1, emailIdx = -1;
    (headerRow||[]).forEach(function(cell, i){
      var v = String(cell===undefined||cell===null ? "" : cell).trim().toLowerCase().replace(/\s+/g,"");
      if(idIdx===-1 && idAliases.indexOf(v)!==-1) idIdx = i;
      if(emailIdx===-1 && emailAliases.indexOf(v)!==-1) emailIdx = i;
    });
    return { idIdx:idIdx, emailIdx:emailIdx };
  }

  function parseExcelRowsToEmails(aoa){
    if(!aoa || !aoa.length) return { rows:[], errors:["빈 파일이에요."] };
    var idIdx = 0, emailIdx = 2, startRow = 0;
    var detected = detectEmailColumns(aoa[0]);
    if(detected.idIdx !== -1 && detected.emailIdx !== -1){
      idIdx = detected.idIdx; emailIdx = detected.emailIdx; startRow = 1; // skip header row
    }
    var rows = [], errors = [];
    for(var r = startRow; r < aoa.length; r++){
      var row = aoa[r] || [];
      var empId = String(row[idIdx]===undefined||row[idIdx]===null ? "" : row[idIdx]).trim();
      var email = String(row[emailIdx]===undefined||row[emailIdx]===null ? "" : row[emailIdx]).trim().toLowerCase();
      if(!empId && !email) continue; // blank row
      if(!empId){ errors.push((r+1)+"행: 사번이 비어있어요."); continue; }
      if(!state.employees.find(function(e){ return e.empId === empId; })){
        errors.push((r+1)+"행: 사번 "+empId+"인 직원을 찾을 수 없어요.");
        continue;
      }
      if(!email || email.indexOf("@") === -1){
        errors.push((r+1)+"행("+empId+"): 이메일 형식이 아니에요 → \""+email+"\"");
        continue;
      }
      rows.push({ empId:empId, email:email });
    }
    return { rows:rows, errors:errors };
  }

  async function adminBulkUpdateEmailsFromExcel(file){
    if(typeof XLSX === "undefined"){ toast("표 읽기 라이브러리를 불러오는 중이에요. 잠시 후 다시 시도해주세요."); return false; }
    try{
      var buf = await file.arrayBuffer();
      var wb = XLSX.read(buf, {type:"array"});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, {header:1, blankrows:false, defval:""});
      var parsed = parseExcelRowsToEmails(aoa);
      if(parsed.errors.length){ toast("형식 오류 "+parsed.errors.length+"건:\n"+parsed.errors.slice(0,5).join("\n"), 5500); return false; }
      return await commitBulkEmails(parsed.rows);
    }catch(e){ toast("엑셀 파일을 읽는 데 실패했어요. 파일 형식을 확인해주세요."); return false; }
  }

  async function seedInitialData(){

      if(!existing.empty){ toast("이미 직원 데이터가 있어서 건너뛰었어요."); return; }
      var batch = db.batch();
      SEED_EMPLOYEES.forEach(function(e){ batch.set(db.doc("employees/"+e.empId), e); });

    }catch(e){ toast("초기화에 실패했어요: " + ((e && e.message) || "관리자 계정으로 로그인했는지 확인해주세요.")); }

  // deletes every consent + check-in record (testing artifacts), so every employee
  // sees the consent screen again and starts with a clean attendance history.
  // Leaves the employee list and site/settings config untouched.
  // 호출 전에 AdminDangerCard의 문구 입력 확인을 이미 거친 상태라고 가정한다
  // (여기서 다시 confirm()을 띄우면 우리 카드 UI랑 브라우저 기본 팝업이 중복된다).
  async function adminResetAllData(){
    try{
      var consentSnap = await db.collection("consents").get();
      var checkinSnap = await db.collection("checkins").get();
      var refs = consentSnap.docs.map(function(d){ return d.ref; })
        .concat(checkinSnap.docs.map(function(d){ return d.ref; }));
      if(!refs.length){ toast("지울 동의·출퇴근 기록이 없어요."); return; }
      var chunkSize = 400; // Firestore batches cap at 500 writes
      for(var i=0; i<refs.length; i+=chunkSize){
        var batch = db.batch();
        refs.slice(i, i+chunkSize).forEach(function(ref){ batch.delete(ref); });
        await batch.commit();
      }
      state.adminRows = [];
      state.adminSelected = {};
      state.myMonthDoc = null;
      state.consent = state.myId ? null : undefined;
      toast(refs.length+"건의 동의·출퇴근 기록을 초기화했어요.");
      render();
    }catch(e){ toast("초기화에 실패했어요. 관리자 권한이 있는 계정인지 확인해주세요."); }
  }

  // builds one report-style sheet: a merged title row, a merged subtitle row,
  // a blank spacer row, then a header row followed by the data — readable
  // straight out of Excel without any manual resizing.
  function sheetWithTitle(title, subtitle, headers, dataRows, colWidths){
    var aoa = [[title], [subtitle], []];
    aoa.push(headers);
    dataRows.forEach(function(row){ aoa.push(headers.map(function(h){ return row[h]; })); });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = colWidths.map(function(w){ return {wch:w}; });
    ws["!merges"] = [
      {s:{r:0,c:0}, e:{r:0,c:headers.length-1}},
      {s:{r:1,c:0}, e:{r:1,c:headers.length-1}}
    ];
    return ws;
  }

  function exportExcel(){
    if(typeof XLSX === "undefined"){ toast("표 생성 라이브러리를 불러오는 중이에요. 잠시 후 다시 시도해주세요."); return; }
    var rows = state.adminRows.filter(function(r){ return state.adminSiteFilter==="all" || r.site===state.adminSiteFilter; });
    if(rows.length===0){ toast("내보낼 기록이 없어요."); return; }

    var siteLabel = state.adminSiteFilter==="all" ? "전체" : (state.config.sites[state.adminSiteFilter] ? state.config.sites[state.adminSiteFilter].label : state.adminSiteFilter);
    var now = new Date();
    var subtitleLine = "대상 월: "+state.adminMonth+" · 지점: "+siteLabel+" · 생성: "+TODAY_KEY(now)+" "+HHMM(now);

    // ---- 상세기록: every check-in/out, oldest first so it reads top-to-bottom like a log ----
    // 기기ID/IP는 관리자 화면(대리출근 의심 감지)에서 계속 쓰이지만 리포트에는
    // 굳이 필요 없는 원시값이라 내보내지 않고, 대신 로그인 이메일로 누가 찍었는지
    // 바로 알아볼 수 있게 한다 (직원 정보에서 사번으로 조회).
    var emailByEmpId = {};
    state.employees.forEach(function(e){ emailByEmpId[e.empId] = e.email || ""; });
    var detail = rows.map(function(r){
      return {
        "날짜": r.date, "사번": r.empId, "이름": r.name, "부서": r.dept||"",
        "지점": state.config.sites[r.site] ? state.config.sites[r.site].label : (r.site||""),
        "구분": r.type==="in" ? "출근" : "퇴근", "시각": r.time, "상태": r.status,
        "확인방식": r.method==="wifi" ? "와이파이" : (r.method==="gps" ? "GPS" : (r.distanceM!=null ? "GPS" : "")),
        "이메일": emailByEmpId[r.empId] || "",
        "지각사유": r.reason || "",
        "수정자": r.editedBy||"", "수정시각": r.editedAt||""
      };
    }).sort(function(a,b){
      if(a["날짜"] !== b["날짜"]) return a["날짜"] < b["날짜"] ? -1 : 1;
      var byName = String(a["이름"]||"").localeCompare(String(b["이름"]||""), "ko");
      if(byName !== 0) return byName;
      var order = {"출근":0, "퇴근":1};
      return (order[a["구분"]]||0) - (order[b["구분"]]||0);
    });
    var detailHeaders = ["날짜","사번","이름","부서","지점","구분","시각","상태","확인방식","이메일","지각사유","수정자","수정시각"];
    var detailWidths  = [11, 9, 9, 16, 10, 7, 7, 7, 10, 24, 22, 10, 17];

    // ---- 요약: per-employee monthly totals, ready to hand over as a report ----
    var byEmp = {};
    rows.forEach(function(r){
      var e = byEmp[r.empId] = byEmp[r.empId] || { empId:r.empId, name:r.name, dept:r.dept||"", site:r.site, inDates:{}, late:0, early:0 };
      if(r.type === "in"){
        e.inDates[r.date] = true;
        if(r.status === "지각") e.late++;
      }
      if(r.type === "out" && r.status === "조퇴") e.early++;
    });
    var summary = Object.keys(byEmp).map(function(k){
      var e = byEmp[k];
      return {
        "사번": e.empId, "이름": e.name, "부서": e.dept,
        "지점": state.config.sites[e.site] ? state.config.sites[e.site].label : (e.site||""),
        "출근일수": Object.keys(e.inDates).length,
        "지각": e.late, "조퇴": e.early
      };
    }).sort(function(a,b){ return String(a["이름"]||"").localeCompare(String(b["이름"]||""), "ko"); });
    var summaryHeaders = ["사번","이름","부서","지점","출근일수","지각","조퇴"];
    var summaryWidths  = [9, 9, 16, 10, 9, 7, 7];

    try{
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, sheetWithTitle("3R 출퇴근 요약 리포트", subtitleLine, summaryHeaders, summary, summaryWidths), "요약");
      XLSX.utils.book_append_sheet(wb, sheetWithTitle("3R 출퇴근 상세기록", subtitleLine, detailHeaders, detail, detailWidths), "상세기록");
      XLSX.writeFile(wb, "출퇴근기록_"+state.adminMonth+".xlsx");
      toast("엑셀 파일을 다운로드했어요.");
    }catch(e){ toast("내보내기에 실패했어요."); }
  }

  function render(){
    var root = document.getElementById("app");
    root.innerHTML = "";
    root.className = state.tab==="admin" ? "wide" : "";
    root.appendChild(Topbar());

    if(configMissing){
      root.appendChild(el("div",{class:"card"},[
        el("h3",{},["Firebase 설정이 필요해요"]),
        el("div",{class:"muted"},["이 파일 상단의 firebaseConfig 값을 본인의 Firebase 프로젝트 값으로 바꿔주세요. 함께 받은 설정 가이드 문서를 참고하시면 됩니다."])
      ]));
      return;
    }
    if(!capsReady){
      root.appendChild(el("div",{class:"card"},[el("div",{class:"muted"},["불러오는 중…"])]));
      return;

    root.appendChild(Tabbar());

      root.appendChild(AdminScreen());
      return;
    }

    if(state.googleUnmatched){
      root.appendChild(el("div",{class:"card"},[
        el("div",{class:"muted"},["("+((state.authUser&&state.authUser.email)||"")+") 이 이메일로 등록된 직원 정보가 없어요. 관리자에게 이메일 등록을 요청해주세요."]),
        el("button",{class:"btn btn-ghost", onclick:employeeSignOut},["로그아웃"])
      ]));
      return;
    }
    if(!state.myId){
      if(isGoogleUser(state.authUser)){
        // signed in already — just waiting on the employee list to resolve who this is
        root.appendChild(el("div",{class:"card"},[el("div",{class:"muted"},["확인 중…"])]));
        return;
      }
      root.appendChild(IdentityScreen()); return;
    }
    var emp = myEmployee();
    if(!emp){
      root.appendChild(el("div",{class:"card"},[
        el("div",{class:"muted"},["등록된 직원 정보를 찾을 수 없어요. 관리자에게 문의해주세요."]),
        el("button",{class:"btn btn-ghost", onclick:employeeSignOut},["로그아웃"])
      ]));
      return;
    }
    if(state.consent === undefined){ root.appendChild(el("div",{class:"card"},[el("div",{class:"muted"},["확인 중…"])])); return; }
    if(!state.consent){ root.appendChild(ConsentScreen(emp)); return; }

    root.appendChild(MeScreen(emp));
  }

  function MeScreen(emp){
    var site = state.config.sites[emp.site] || {label: emp.site};
    var hours = effectiveHours(emp);
    var anyIpConfigured = Object.keys(state.config.sites).some(function(k){
      return String(state.config.sites[k].ip||"").trim().length > 0;
    });
    var checkHintText = anyIpConfigured
      ? "사무실 와이파이에 연결돼 있어야 체크돼요"
      : "관리자가 와이파이 설정을 완료해야 체크할 수 있어요";
    var todays = todaysRecords(state.myMonthDoc);
    var hasIn = todays.some(function(r){ return r.type==="in"; });
    var hasOut = todays.some(function(r){ return r.type==="out"; });

    // 이번 달 본인 현황 — 관리자한테 안 물어봐도 본인이 바로 확인할 수 있게.
    var monthRecords = (state.myMonthDoc && state.myMonthDoc.records) || [];
    var myInDates = {};
    var myLateCount = 0, myEarlyCount = 0;
    monthRecords.forEach(function(r){
      if(r.type === "in"){
        myInDates[r.date] = true;
        if(r.status === "지각") myLateCount++;
      }
      if(r.type === "out" && r.status === "조퇴") myEarlyCount++;
    });
    var myInDayCount = Object.keys(myInDates).length;

    var reminderTime = shiftHHMM(hours.start, -15);
    var showReminder = !hasIn && HHMM() >= reminderTime;
    var reminderBanner = !showReminder ? null : el("div",{class:"card", style:"background:var(--warn-soft);border:1px solid var(--warn);"},[
      el("div",{style:"font-weight:700;color:var(--warn);"},["⏰ 출근 체크 잊지 마세요"]),
      el("div",{class:"muted", style:"font-size:13px;"},["근무 시작(" + hours.start + ") 전후예요. 출근하기 버튼을 눌러 체크해주세요."])
    ]);

    var nextBtn;
    if(!hasIn){
      // 이미 근무 시작 시각을 지났으면 체크했을 때 "지각"으로 기록될 거라, 눌러보기
      // 전에 미리 사유를 남길 수 있는 선택 입력창을 보여준다. 거짓말을 막을 수는
      // 없지만(사유 검증 불가), 검증 목적이 아니라 관리자가 나중에 참고할 기록용.
      var willBeLate = HHMM() > hours.start;
      var checkinBtn = el("button",{class:"big-btn checkin", disabled:state.busy, onclick:function(){
        doCheck("in", state.lateReasonDraft);
      }},[
        el("span",{},[state.busy?"확인 중…":"출근하기"]),
        el("span",{class:"sub"},[checkHintText])
      ]);
      if(willBeLate){
        var reasonInput = el("input",{type:"text", value:state.lateReasonDraft,
          placeholder:"지각 사유 (선택, 안 남겨도 돼요)",
          oninput:function(ev){ state.lateReasonDraft = ev.target.value; }});
        nextBtn = el("div",{class:"col", style:"gap:8px;"},[reasonInput, checkinBtn]);

    var seoulIp = el("input",{type:"text", value:c.sites.seoul.ip||"", placeholder:"예: 193.186.4.174 또는 121.138.152.* (쉼표로 여러개 가능)"});
    var daejeonLabel = el("input",{type:"text", value:c.sites.daejeon.label});
    var daejeonIp = el("input",{type:"text", value:c.sites.daejeon.ip||"", placeholder:"예: 193.186.4.174 또는 121.138.152.* (쉼표로 여러개 가능)"});
    var startIn = el("input",{type:"time", value:c.workStart});
    var endIn = el("input",{type:"time", value:c.workEnd});
    var policyIn = el("textarea",{}, [c.policyText]);

    return el("div",{class:"card"},[
      el("h3",{style:"font-size:15px;"},["설정"]),
      el("div",{class:"muted", style:"font-size:12px;"},["출퇴근 체크는 사무실 와이파이(공인 IP) 인식 방식으로 동작해요. 사업장마다 와이파이 IP를 반드시 입력해주세요 — 비워두면 그 사업장은 체크가 안 돼요."]),
      el("div",{class:"muted"},["서울 사업장"]),
      el("div",{class:"grid2"},[mk("명칭", seoulLabel), mk("와이파이 공인 IP", seoulIp)]),
      el("div",{class:"muted"},["대전 사업장"]),
      el("div",{class:"grid2"},[mk("명칭", daejeonLabel), mk("와이파이 공인 IP", daejeonIp)]),
      el("div",{class:"grid2"},[mk("기본 근무 시작", startIn), mk("기본 근무 종료", endIn)]),
      el("div",{class:"muted", style:"font-size:12px;"},["직원마다 근무시간이 다르면 '직원 관리'에서 그 직원만 예외로 설정할 수 있어요."]),
      mk("개인정보 동의 안내문", policyIn),
      el("button",{class:"btn btn-primary", onclick:function(){
        adminSaveSettings({
          sites: {
            seoul:{ label:seoulLabel.value, lat:c.sites.seoul.lat, lng:c.sites.seoul.lng, ip:seoulIp.value.trim() },
            daejeon:{ label:daejeonLabel.value, lat:c.sites.daejeon.lat, lng:c.sites.daejeon.lng, ip:daejeonIp.value.trim() }
          },
          radiusM: c.radiusM,
          workStart: startIn.value, workEnd: endIn.value,
          policyText: policyIn.value,
          policyVersion: c.policyVersion
        });
      }},["설정 저장"])
    ]);
  }

  function AdminSeedCard(){
    return el("div",{class:"card"},[
      el("h3",{style:"font-size:15px;"},["초기 데이터 세팅"]),
      el("div",{class:"muted"},["최초 1회만 눌러주세요. 이미 직원 데이터가 있으면 아무 것도 바뀌지 않아요."]),
      el("button",{class:"btn btn-ghost", onclick:seedInitialData},["기본 직원·설정 데이터 심기"])
    ]);
  }

  function AdminDangerCard(){
    var CONFIRM_WORD = "초기화";
    if(state.confirmingReset){
      // typed-confirmation instead of a plain 취소/확인 pair — this wipes every
      // employee's data at once, so a single reflex click shouldn't be enough.
      var confirmIn = el("input",{type:"text", value:state.resetConfirmText, placeholder:CONFIRM_WORD,
        oninput:function(ev){ state.resetConfirmText = ev.target.value; }});
      return el("div",{class:"card", style:"border:1px solid var(--bad);"},[
        el("h3",{style:"font-size:15px;color:var(--bad);"},["정말로 전체 초기화할까요?"]),
        el("div",{class:"muted"},["모든 직원의 개인정보 동의 기록과 출퇴근 기록이 전부 삭제돼요. 직원 목록·와이파이·근무시간 설정은 그대로 남아요. 되돌릴 수 없어요."]),
        el("label",{class:"field"},["확인을 위해 \""+CONFIRM_WORD+"\"라고 입력해주세요", confirmIn]),
        el("div",{class:"row"},[
          el("button",{class:"btn btn-ghost", onclick:function(){ state.confirmingReset=false; state.resetConfirmText=""; render(); }},["취소"]),
          el("button",{class:"btn btn-bad", onclick:function(){
            if((state.resetConfirmText||"").trim() !== CONFIRM_WORD){
              toast("\""+CONFIRM_WORD+"\"라고 정확히 입력해야 실행돼요.", 3200);
              return;
            }
            state.confirmingReset = false; state.resetConfirmText = "";
            adminResetAllData();
          }},["초기화 실행"])
        ])
      ]);
    }
    return el("div",{class:"card", style:"border:1px solid var(--bad);"},[
      el("h3",{style:"font-size:15px;color:var(--bad);"},["테스트 데이터 초기화"]),
      el("div",{class:"muted"},["관리자님 컴퓨터로 여러 사번을 테스트해봤다면, 그때 생긴 개인정보 동의·출퇴근 기록을 여기서 한 번에 지울 수 있어요. 직원 목록, 와이파이·근무시간 설정은 그대로 남고, 모든 사번의 동의 기록과 출퇴근 기록만 삭제돼요 (되돌릴 수 없어요)."]),
      el("button",{class:"btn btn-danger", onclick:function(){ state.confirmingReset=true; state.resetConfirmText=""; render(); }},["동의·출퇴근 기록 전체 초기화"])
    ]);
  }

  /* ---------- clock tick ---------- */
  setInterval(function(){
    if(document.hidden) return;
    var clockEl = document.querySelector(".clock");
    if(clockEl) clockEl.textContent = HHMM()+":"+String(new Date().getSeconds()).padStart(2,"0");
  }, 1000);

  // periodic full re-render so the check-in reminder banner appears on its own
  // if the app is left open, without needing any user interaction.
  setInterval(function(){
    if(document.hidden) return;
    if(state.tab === "me" && !state.busy) render();
  }, 30000);

  /* ---------- admin idle auto-logout ----------
     Firebase's own ID token TTL (~1hr) doesn't help here — the SDK silently
     refreshes it in the background as long as the tab stays open, so a signed-in
     admin session never expires on its own. We track real user activity
     ourselves and force a sign-out after a period of no interaction, so an
     admin panel left open on an unattended computer doesn't stay accessible
     forever. */
  var ADMIN_IDLE_TIMEOUT_MS = 30 * 60 * 1000; // 30분 무활동 시 자동 로그아웃
  var lastActivityAt = Date.now();
  ["mousemove","mousedown","keydown","touchstart","scroll"].forEach(function(evt){
    document.addEventListener(evt, function(){ lastActivityAt = Date.now(); }, { passive:true });
  });
  setInterval(function(){
    if(state.isAdmin && (Date.now() - lastActivityAt) > ADMIN_IDLE_TIMEOUT_MS){
      lastActivityAt = Date.now(); // avoid re-triggering every tick while signOut() is in flight
      toast("장시간 활동이 없어 관리자 계정이 자동 로그아웃됐어요.", 4200);
      adminLogout();
    }
  }, 30000);

  render();
  initFirebase();
})();
</script>
